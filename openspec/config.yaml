# OpenSpec Config — magic_life_counters
# Generated by the SDD init phase. Detected from the repository on 2026-11-03.

schema: spec-driven

context: |
  Project: magic_life_counters — phone-first PWA life counter for Magic: The Gathering (LifeElk clone).
  Tech stack: React 19 + TypeScript 7 (strict) + Vite 8; zustand v5 (persist → localStorage); vite-plugin-pwa v2 (autoUpdate).
  Styling: CSS Modules + custom-property design tokens in src/index.css. No Tailwind, no CSS framework.
  Architecture: single-page app; all domain logic lives in one zustand store (src/store/useGameStore.ts); components are presentational over store selectors.
  i18n: every user-facing string is centralized in src/locales/en.ts (single source of truth). The UI currently ships in English.
  Testing: vitest 5 + Testing Library (jsdom). 28 unit tests over the store; no component-level tests yet.
  Quality: oxlint (lint), tsc -b (typecheck), npm run build (tsc -b && vite build). Node 24 (.nvmrc), npm 11.6.2.
  CI: .github/workflows/ci.yml → lint → typecheck → test → build on push/PR to main.
  Artifact store: hybrid (OpenSpec files + Engram). SDD artifacts are written in English; conversation and UI language is Spanish.

strict_tdd: true
# A test runner exists and is fully wired: vitest 5 + jsdom + @testing-library/react,
# setup file src/test/setup.ts, 28 passing unit tests. Strict TDD is supported by this stack.

session:
  execution_mode: auto
  artifact_store: hybrid
  delivery_strategy: auto-chain
  chain_strategy: undecided
  review_budget_lines: 800
  conversation_language: es
  artifact_language: en

testing:
  runner: npm test
  framework: Vitest 5.1 (+ @testing-library/react 16, @testing-library/jest-dom 7, jsdom 29)
  environment: jsdom
  setup_files:
    - ./src/test/setup.ts
  layers: { unit: true, integration: true, e2e: false }
  existing_suite: src/store/useGameStore.test.ts — 28 unit tests over store domain logic; no component tests yet
  coverage:
    available: false
    command: "npx vitest run --coverage (requires @vitest/coverage-v8 — NOT installed)"
  quality:
    linter: "npm run lint (oxlint 1.89)"
    type_checker: "npm run typecheck (tsc -b — TypeScript 7, strict)"
    formatter: "none (no Prettier, Biome or dprint configured)"

rules:
  proposal:
    - Include a rollback plan for any change that touches the persisted game state (localStorage key mtg-life-counter).
    - State explicitly whether the zustand `persist` `version` must be bumped and whether a migration is required.
    - Keep the scope phone-first: the primary target is a 375x812 viewport with zero vertical scroll.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Express requirements in observable user-visible behavior; reuse the domain vocabulary from src/types.ts.
    - Every scenario MUST be implementable as an automated test (vitest + Testing Library).
  design:
    - Document architecture decisions with rationale.
    - Keep domain logic in src/store/useGameStore.ts; components stay presentational and read state through store selectors.
    - Respect the mobile-first invariants: 44x44px minimum touch targets, safe-area insets, no horizontal overflow between 320px and 1280px.
    - Timer and clock-dependent behavior MUST derive from wall-clock timestamps (Date.now), never from tick counters.
    - Any new user-facing string MUST be added to src/locales/en.ts — never inlined in a component.
  tasks:
    - Group by phase and use hierarchical numbering (1.1, 1.2, 2.1, ...).
    - Keep tasks completable in one session.
    - Name the exact file path each task creates or modifies.
    - Pair every implementation task with the test task that proves it.
  apply:
    guidelines:
      - Follow existing code patterns: zustand selectors, colocated CSS Modules, `import type` for type-only imports.
      - Add new strings to src/locales/en.ts only; the interface Strings is the contract.
      - Do not introduce a CSS framework, a state library, or a test runner other than the ones already configured.
      - Keep the store's public action surface in src/store/useGameStore.ts and its types in src/types.ts.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
    lint_command: "npm run lint"
    typecheck_command: "npm run typecheck"
  archive:
    - Warn before merging destructive deltas into the main specs.
    - When the persisted game shape changed, record the `persist` version bump and migration path in the archive report.
